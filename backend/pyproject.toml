[project]
name = "farmops-backend"
version = "0.1.0"
description = "FarmOps AI - Autonomous Multi-Agent Agricultural Operations Backend"
authors = [
    { name = "FarmOps AI Team", email = "dev@farmops.ai" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "pyjwt[crypto]>=2.8.0",
    "aiomqtt>=2.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
    "aiosqlite>=0.20.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]

[tool.setuptools]
packages = ["app"]
